name: Generate Profile Summary

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: Kishan-Kumar-Hv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
